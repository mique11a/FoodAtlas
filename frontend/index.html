<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodAtlas - 全球食品营养结构可视分析</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #fdf6f0; color: #4a3728; }
  .header { background: #fff; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #f0a060; box-shadow: 0 2px 8px rgba(200,120,50,0.08); }
  .header h1 { font-size: 20px; color: #d36a2c; }
  .toolbar { display: flex; gap: 12px; align-items: center; }
  .toolbar label { font-size: 13px; color: #8b5e3c; }
  .toolbar select, .toolbar button { padding: 6px 14px; border: 1px solid #e0c8a8; border-radius: 6px; background: #fff; color: #4a3728; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .toolbar select:hover, .toolbar button:hover { border-color: #f0a060; background: #fff8f2; }
  .toolbar button { background: #f0a060; color: #fff; border-color: #f0a060; font-weight: bold; }
  .toolbar button:hover { background: #e08e4a; }
  .dashboard { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 220px 150px 1fr; gap: 12px; padding: 12px; height: calc(100vh - 56px); }
  .panel { background: #fff; border-radius: 8px; border: 1px solid #ead5c0; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2px 10px rgba(150,100,50,0.06); }
  .panel-title { padding: 10px 16px; font-size: 13px; font-weight: bold; color: #c05e1a; background: linear-gradient(180deg, #fff9f3, #fff3e6); border-bottom: 1px solid #ead5c0; flex-shrink: 0; }
  .panel-body { flex: 1; min-height: 0; }
  .panel-map { grid-column: 1; grid-row: 1 / 3; }
  .panel-structure { grid-column: 2; grid-row: 1 / 3; }
  .panel-anomaly { grid-column: 1; grid-row: 3; }
  .panel-price { grid-column: 2; grid-row: 3; }
  .panel-detail { grid-column: 1 / 3; grid-row: 3; background: #fffbf7; z-index: 10; pointer-events: none; clip-path: circle(0% at var(--detail-x, 50%) var(--detail-y, 50%)); opacity: 0; transition: clip-path 0.35s ease-out, opacity 0.25s ease-out; }
  .panel-detail.show { pointer-events: auto; clip-path: circle(80% at var(--detail-x, 50%) var(--detail-y, 50%)); opacity: 1; }
  .detail-content { padding: 12px 16px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; overflow-y: auto; }
  .detail-card { background: #fff; border-radius: 6px; padding: 12px 16px; min-width: 210px; border: 1px solid #ead5c0; box-shadow: 0 1px 4px rgba(150,100,50,0.04); }
  .detail-card h4 { color: #c05e1a; margin-bottom: 8px; font-size: 13px; border-bottom: 1px dotted #ead5c0; padding-bottom: 4px; }
  .detail-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .detail-label { color: #a0846a; }
  .detail-value { color: #4a3728; font-weight: bold; }
  .flag-tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; margin: 2px; }
  .flag-warn { background: #ffe0b2; color: #e65100; }
  .flag-bad { background: #ffcdd2; color: #b71c1c; }
  .flag-good { background: #c8e6c9; color: #1b5e20; }
  .note { color: #b8a088; font-size: 11px; padding: 10px 16px; }
</style>
</head>
<body>

<div class="header">
  <h1>🍽️ FoodAtlas — 开放食品营养结构可视分析</h1>
  <div class="toolbar">
    <label style="align-self:center;font-size:13px;">国家</label>
    <select id="countrySelect"><option value="">全部国家</option></select>
    <label style="align-self:center;font-size:13px;">品类</label>
    <select id="categorySelect"><option value="">全部品类</option></select>
    <label style="align-self:center;font-size:13px;">指标</label>
    <select id="metricSelect">
      <option value="health_score">健康评分</option>
      <option value="sugars">糖含量</option>
      <option value="salt">盐含量</option>
      <option value="fat">脂肪</option>
      <option value="energy">能量</option>
      <option value="nutriscore">Nutri-Score</option>
      <option value="nova">NOVA 加工程度</option>
    </select>
    <button id="resetBtn">重置</button>
  </div>
</div>

<div class="dashboard">
  <!-- ① 全球概览地图 -->
  <div class="panel panel-map">
    <div class="panel-title">① 全球食品样本概览 <button id="backToWorld" onclick="resetMapView()" style="display:none;float:right;background:none;border:1px solid #dcc8b0;border-radius:4px;padding:2px 10px;cursor:pointer;color:#8b5e3c;font-size:12px;">← 返回世界</button></div>
    <div class="panel-body" id="chartMap"></div>
  </div>

  <!-- ② 营养结构视图 -->
  <div class="panel panel-structure">
    <div class="panel-title">② 品类营养结构</div>
    <div class="panel-body" id="chartSunburst"></div>
  </div>

  <!-- ③ 产品异常散点图 -->
  <div class="panel panel-anomaly">
    <div class="panel-title">③ 产品异常检测散点图
      <span style="margin-left:12px;font-weight:normal;">
        X <select id="anomalyX" style="font-size:11px;padding:2px 6px;border:1px solid #dcc8b0;border-radius:4px;background:#fff;color:#4a3728;">
          <option value="sugars">糖含量</option><option value="salt">盐含量</option><option value="fat">脂肪</option>
          <option value="health">健康评分</option><option value="nutriscore_num">Nutri-Score</option><option value="nova">NOVA等级</option>
          <option value="energy">能量</option><option value="completeness">数据完整度</option>
        </select>
        Y <select id="anomalyY" style="font-size:11px;padding:2px 6px;border:1px solid #dcc8b0;border-radius:4px;background:#fff;color:#4a3728;">
          <option value="price" selected>价格</option><option value="nova">NOVA等级</option>
          <option value="sugars">糖含量</option><option value="salt">盐含量</option><option value="fat">脂肪</option>
          <option value="health">健康评分</option>
          <option value="nutriscore_num">Nutri-Score</option><option value="energy">能量</option>
          <option value="completeness">数据完整度</option><option value="anomaly">异常度</option>
        </select>
      </span>
    </div>
    <div class="panel-body" id="chartAnomaly"></div>
  </div>

  <!-- ④ 价格-营养关系 -->
  <div class="panel panel-price">
    <div class="panel-title">④ 价格-营养关系</div>
    <div class="panel-body" id="chartPrice"></div>
  </div>

  <!-- ⑤ 产品详情（默认隐藏，点击产品后出现） -->
  <div class="panel panel-detail">
    <div class="panel-title">⑤ 产品详情</div>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<script>
let COUNTRIES = [];
let CATEGORIES = [];
let scatterData = [];
let priceScatterData = [];
let priceCurrency = 'EUR';
let currentDataRequestId = 0;
let worldMapReady = false;
let lastClickPos = { x: 0.5, y: 0.5 };

const mapChart = echarts.init(document.getElementById('chartMap'));
const sunChart = echarts.init(document.getElementById('chartSunburst'));
const anomalyChart = echarts.init(document.getElementById('chartAnomaly'));
const priceChart = echarts.init(document.getElementById('chartPrice'));

let selectedCountry = '';
let selectedCategory = '';
let currentMetric = 'health_score';
let mapZoomedTo = null;

const COUNTRY_CENTERS = {
  'France': [2.75, 46.85],
  'United States': [-89.55, 37.77],
  'Germany': [11.29, 50.45],
  'Spain': [-4.01, 40.83],
  'United Kingdom': [-3.06, 54.34],
  'Italy': [11.95, 44.61],
  'Belgium': [4.84, 50.49],
  'Netherlands': [5.51, 51.93],
  'Switzerland': [8.37, 46.72],
  'Canada': [-96.04, 59.28],
};

const AXIS_META = {
  sugars: { label: '糖含量 (g/100g)', unit: 'g' },
  salt: { label: '盐含量 (g/100g)', unit: 'g' },
  fat: { label: '脂肪 (g/100g)', unit: 'g' },
  health: { label: '健康评分', unit: '' },
  price: { label: '中位价格', unit: '' },
  completeness: { label: '数据完整度', unit: '' },
  nutriscore_num: { label: 'Nutri-Score', unit: '' },
  nova: { label: 'NOVA 等级', unit: '' },
  energy: { label: '能量 (kcal)', unit: 'kcal' },
  anomaly: { label: '异常度', unit: '' },
};

const CAT_COLORS = ['#e67e22','#3498db','#2ecc71','#9b59b6','#1abc9c','#e74c3c','#f1c40f','#e91e63','#7f8c8d','#16a085'];
let catColorMap = {};

async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Failed to load ${url}: ${response.status}`);
  return response.json();
}

function buildQueryString(extra = {}) {
  const params = new URLSearchParams();
  if (selectedCountry) params.set('country', selectedCountry);
  if (selectedCategory) params.set('category', selectedCategory);
  Object.entries(extra).forEach(([key, value]) => {
    if (value !== undefined && value !== null && value !== '') params.set(key, value);
  });
  return params.toString();
}

function setBackButtonVisibility() {
  document.getElementById('backToWorld').style.display = mapZoomedTo ? 'inline-block' : 'none';
}

function updateCategoryColorMap() {
  catColorMap = {};
  CATEGORIES.forEach((category, index) => {
    catColorMap[category.enName] = CAT_COLORS[index % CAT_COLORS.length];
  });
}

function formatNumber(value, digits = 2, suffix = '') {
  if (value === null || value === undefined || Number.isNaN(value)) return '-';
  return `${Number(value).toFixed(digits)}${suffix}`;
}

function getMetricLabel() {
  const map = {
    health_score: '健康评分',
    sugars: '糖含量(g)',
    salt: '盐含量(g)',
    fat: '脂肪(g)',
    energy: '能量(kcal)',
    nutriscore: 'Nutri-Score',
    nova: 'NOVA等级',
  };
  return map[currentMetric] || currentMetric;
}

function getMetricRange(metricKey) {
  const values = COUNTRIES.map(country => country[metricKey]).filter(v => typeof v === 'number' && !Number.isNaN(v));
  if (!values.length) return { min: 0, max: 1 };
  if (metricKey === 'health' || metricKey === 'health_score') return { min: 0, max: 1 };
  if (metricKey === 'nutriscore') return { min: 1, max: 5 };
  if (metricKey === 'nova') return { min: 1, max: 4 };
  const rawMin = Math.min(...values);
  const rawMax = Math.max(...values);
  if (rawMin === rawMax) return { min: rawMin, max: rawMax + 1 };
  return { min: rawMin, max: rawMax };
}

function getAxisMeta(key) {
  if (key !== 'price') return AXIS_META[key];
  return {
    label: `中位价格 (${priceCurrency || '本地币种'})`,
    unit: priceCurrency || '',
  };
}

function getScatterComparableData(data, xKey, yKey) {
  return data.filter(item => {
    if (xKey === 'price' || yKey === 'price') {
      if (!item.price || item.currency !== priceCurrency) return false;
    }
    return item[xKey] !== null && item[xKey] !== undefined && !Number.isNaN(item[xKey])
      && item[yKey] !== null && item[yKey] !== undefined && !Number.isNaN(item[yKey]);
  });
}

function renderMapFallback() {
  mapChart.setOption({
    backgroundColor: 'transparent',
    title: { text: '样本分布', textStyle: { color: '#8b5e3c', fontSize: 14 }, left: 'center', top: 10 },
    tooltip: { trigger: 'axis' },
    grid: { left: 100, right: 40, top: 40, bottom: 20 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#dcc8b0' } }, axisLabel: { color: '#8b5e3c' } },
    yAxis: { type: 'category', data: COUNTRIES.map(c => c.name).reverse(), axisLine: { lineStyle: { color: '#dcc8b0' } }, axisLabel: { color: '#8b5e3c' } },
    series: [{ type: 'bar', data: COUNTRIES.map(c => c.samples).reverse(), itemStyle: { color: '#f0a060' } }]
  }, true);
  mapChart.off('click');
}

function renderMap(metric) {
  if (!COUNTRIES.length) return;
  if (!worldMapReady) {
    renderMapFallback();
    return;
  }

  const metricKey = metric === 'health_score' ? 'health' : metric;
  const range = getMetricRange(metricKey);
  const data = COUNTRIES.map(country => {
    if (!mapZoomedTo) return { name: country.enName, value: country[metricKey] ?? country.health };
    const isSelected = country.enName === mapZoomedTo;
    return { name: country.enName, value: isSelected ? (country[metricKey] ?? country.health) : -1 };
  });

  mapChart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: params => {
        if (params.value === undefined || params.value === null || params.value < 0) {
          return `${params.name}<br/><span style="color:#aaa">(未选中)</span>`;
        }
        const country = COUNTRIES.find(item => item.enName === params.name);
        return `<b>${params.name}</b><br/>样本数: ${country ? country.samples.toLocaleString() : '-'}<br/>${getMetricLabel()}: ${formatNumber(params.value, 2)}`;
      }
    },
    visualMap: {
      min: range.min,
      max: range.max,
      text: [getMetricLabel(), ''],
      textStyle: { color: '#8b5e3c' },
      realtime: false,
      calculable: true,
      inRange: { color: ['#fff2e0', '#fdbe7a', '#f47b3b', '#c0391b'] },
      outOfRange: { color: '#e8ddd0' }
    },
    geo: {
      map: 'world',
      roam: true,
      label: { show: false },
      center: mapZoomedTo ? COUNTRY_CENTERS[mapZoomedTo] : undefined,
      zoom: mapZoomedTo ? 3 : 1,
      itemStyle: { borderColor: '#e8d5c4' },
      emphasis: { itemStyle: { areaColor: '#f0a060' }, label: { show: true, color: '#4a3728' } },
      regions: mapZoomedTo ? COUNTRIES.map(country => ({
        name: country.enName,
        label: { show: country.enName === mapZoomedTo, fontSize: 16, fontWeight: 'bold', color: '#4a3728' }
      })) : []
    },
    series: [{ type: 'map', map: 'world', geoIndex: 0, data }]
  }, { notMerge: false, lazyUpdate: false });

  mapChart.off('click');
  mapChart.on('click', params => {
    if (!params.name || !COUNTRIES.find(country => country.enName === params.name)) return;
    selectedCountry = params.name;
    mapZoomedTo = params.name;
    document.getElementById('countrySelect').value = selectedCountry;
    setBackButtonVisibility();
    refreshAll();
  });
}

function renderSunburst() {
  if (!CATEGORIES.length) return;
  const categories = selectedCategory ? CATEGORIES.filter(category => category.enName === selectedCategory) : CATEGORIES;
  const metricKey = currentMetric === 'health_score' ? 'health' : currentMetric;
  const allValues = CATEGORIES.map(category => category[metricKey] || 0);
  const valueMin = Math.min(...allValues);
  const valueMax = Math.max(...allValues);
  const data = categories.map(category => {
    const value = category[metricKey] || 0;
    const t = valueMax > valueMin ? (value - valueMin) / (valueMax - valueMin) : 0.5;
    const r = Math.round(255 - t * 70);
    const g = Math.round(220 - t * 160);
    const b = Math.round(190 - t * 150);
    return {
      name: category.name,
      value: category.samples,
      itemStyle: { color: `rgb(${r},${g},${b})` }
    };
  });

  sunChart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: params => {
        const category = CATEGORIES.find(item => item.name === params.name);
        const metricValue = category ? category[metricKey] : null;
        return `<b>${params.name}</b><br/>${getMetricLabel()}: ${metricValue !== null && metricValue !== undefined ? Number(metricValue).toFixed(1) : '-'}<br/>样本: ${params.value?.toLocaleString()}<br/>占比: ${params.percent}%`;
      }
    },
    series: [{
      type: 'sunburst',
      data,
      radius: ['22%', '88%'],
      center: ['50%', '50%'],
      label: { rotate: selectedCategory ? 0 : 'radial', fontSize: selectedCategory ? 22 : 12, fontWeight: 'bold', color: '#3e2723' },
      emphasis: { itemStyle: { borderColor: '#c0391b', borderWidth: 3, shadowBlur: 8, shadowColor: 'rgba(0,0,0,0.15)' } }
    }]
  }, { notMerge: false, lazyUpdate: false });

  sunChart.off('click');
  sunChart.on('click', params => {
    const category = CATEGORIES.find(item => item.name === params.name);
    if (!category) return;
    selectedCategory = selectedCategory === category.enName ? '' : category.enName;
    document.getElementById('categorySelect').value = selectedCategory;
    refreshAll();
  });
}

function renderAnomaly() {
  const xKey = document.getElementById('anomalyX').value;
  const yKey = document.getElementById('anomalyY').value;
  const xMeta = getAxisMeta(xKey);
  const yMeta = getAxisMeta(yKey);
  const data = getScatterComparableData(scatterData, xKey, yKey);

  anomalyChart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: params => {
        const item = params.data;
        return `<b>${item?.name}</b><br/>品类: ${item?.categoryLabel || item?.category}<br/>国家: ${item?.countryLabel || item?.country}<br/>${xMeta.label}: ${formatNumber(item?.[xKey], 2)} ${xMeta.unit}<br/>${yMeta.label}: ${formatNumber(item?.[yKey], 2)} ${yMeta.unit}<br/>异常度: ${formatNumber(item?.anomaly, 2)}`;
      }
    },
    legend: {
      data: CATEGORIES.map(category => category.name),
      top: 5,
      textStyle: { color: '#8b5e3c', fontSize: 10 },
      itemGap: 8
    },
    grid: { left: 70, right: 30, top: 35, bottom: 50 },
    xAxis: { name: xMeta.label, nameLocation: 'center', nameGap: 35, nameTextStyle: { color: '#8b5e3c', fontSize: 12 }, axisLine: { lineStyle: { color: '#dcc8b0' } }, axisLabel: { color: '#8b5e3c' } },
    yAxis: { name: yMeta.label, nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#8b5e3c', fontSize: 12 }, axisLine: { lineStyle: { color: '#dcc8b0' } }, axisLabel: { color: '#8b5e3c' }, splitLine: { lineStyle: { color: '#f0e4d5' } } },
    toolbox: { feature: { brush: { type: ['rect', 'polygon'] } }, right: 10, top: 5 },
    brush: { toolbox: ['rect', 'polygon'], throttleType: 'debounce', throttleDelay: 300 },
    series: CATEGORIES.map(category => ({
      name: category.name,
      type: 'scatter',
      data: data
        .filter(item => item.category === category.enName)
        .map(item => ({
          ...item,
          value: [item[xKey], item[yKey]],
          symbolSize: Math.min(22, Math.max(6, ((item.anomaly || 1) * 3.5) + 4))
        })),
      itemStyle: { color: catColorMap[category.enName], opacity: 0.75 },
      emphasis: { itemStyle: { borderColor: '#333', borderWidth: 2, opacity: 1 } }
    })),
    graphic: data.length ? [] : [{
      type: 'text',
      left: 'center',
      top: 'middle',
      style: { text: '当前筛选条件下无可绘制样本', fill: '#a0846a', fontSize: 14 }
    }]
  }, true);

  anomalyChart.off('click');
  anomalyChart.on('click', params => {
    if (params.data) showDetail(params.data, params.event);
  });
  anomalyChart.off('brushSelected');
  anomalyChart.on('brushSelected', params => {
    const firstSelected = params.batch?.[0]?.selected?.find(item => item.dataIndex?.length);
    if (!firstSelected) return;
    const option = anomalyChart.getOption();
    const seriesData = option?.series?.[firstSelected.seriesIndex]?.data;
    const picked = Array.isArray(seriesData) ? seriesData[firstSelected.dataIndex[0]] : null;
    if (picked) showDetail(picked);
  });
}

function renderPrice() {
  const data = priceScatterData
    .filter(item => item.price !== null && item.price !== undefined && !Number.isNaN(item.price))
    .map(item => ({
      ...item,
      value: [item.price, item.health],
      itemStyle: {
        color: item.health > 0.6 ? '#43a047' : item.health > 0.35 ? '#f0a060' : '#d8433f',
        opacity: 0.8
      }
    }));
  priceChart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: params => `<b>${params.data?.name}</b><br/>国家: ${params.data?.countryLabel || params.data?.country}<br/>品类: ${params.data?.categoryLabel || params.data?.category}<br/>价格: ${priceCurrency || ''} ${formatNumber(params.data?.price, 2)}<br/>健康评分: ${formatNumber(params.data?.health, 2)}`
    },
    grid: { left: 75, right: 25, top: 25, bottom: 60 },
    xAxis: { name: `中位价格 (${priceCurrency || '本地币种'})`, nameLocation: 'center', nameGap: 42, nameTextStyle: { color: '#8b5e3c', fontSize: 12 }, axisLine: { lineStyle: { color: '#dcc8b0' } }, axisLabel: { color: '#8b5e3c' }, splitLine: { lineStyle: { color: '#f0e4d5' } } },
    yAxis: { name: '健康评分', nameLocation: 'center', nameGap: 50, min: 0, max: 1, nameTextStyle: { color: '#8b5e3c', fontSize: 12 }, axisLine: { lineStyle: { color: '#dcc8b0' } }, axisLabel: { color: '#8b5e3c' }, splitLine: { lineStyle: { color: '#f0e4d5' } } },
    series: [{
      type: 'scatter',
      data,
      symbolSize: 10,
      markLine: {
        silent: true,
        data: [{ type: 'average', name: '平均健康评分', lineStyle: { color: '#d36a2c', type: 'dashed' } }],
        label: { color: '#8b5e3c' }
      }
    }],
    graphic: data.length ? [] : [{
      type: 'text',
      left: 'center',
      top: 'middle',
      style: { text: '当前筛选条件下无价格样本', fill: '#a0846a', fontSize: 14 }
    }]
  }, true);

  priceChart.off('click');
  priceChart.on('click', params => {
    if (params.data) showDetail(params.data, params.event);
  });
}

function showDetail(data, event) {
  if (!data) return;
  const panel = document.querySelector('.panel-detail');
  if (event) {
    const rect = panel.getBoundingClientRect();
    const clickX = ((event.clientX - rect.left) / rect.width) * 100;
    const clickY = ((event.clientY - rect.top) / rect.height) * 100;
    lastClickPos = { x: Math.max(0, Math.min(100, clickX)), y: Math.max(0, Math.min(100, clickY)) };
  }
  panel.style.setProperty('--detail-x', `${lastClickPos.x}%`);
  panel.style.setProperty('--detail-y', `${lastClickPos.y}%`);

  const flagNames = {
    high_price_low_health: '高价低健康',
    high_sugar_high_nova: '高糖高加工',
    low_completeness_many_warnings: '低完整度且警告多'
  };

  const html = `
    <div class="detail-card">
      <h4>📦 ${data.name || data.id}</h4>
      <div class="detail-row"><span class="detail-label">国家</span><span class="detail-value">${data.countryLabel || data.country || '-'}</span></div>
      <div class="detail-row"><span class="detail-label">品类</span><span class="detail-value">${data.categoryLabel || data.category || '-'}</span></div>
      <div class="detail-row"><span class="detail-label">Nutri-Score</span><span class="detail-value">${data.nutriscore || '-'}</span></div>
      <div class="detail-row"><span class="detail-label">NOVA 等级</span><span class="detail-value">${data.nova || '-'}</span></div>
    </div>
    <div class="detail-card">
      <h4>🔬 营养指标</h4>
      <div class="detail-row"><span class="detail-label">糖</span><span class="detail-value">${formatNumber(data.sugars, 1, ' g')}</span></div>
      <div class="detail-row"><span class="detail-label">盐</span><span class="detail-value">${formatNumber(data.salt, 2, ' g')}</span></div>
      <div class="detail-row"><span class="detail-label">脂肪</span><span class="detail-value">${formatNumber(data.fat, 1, ' g')}</span></div>
      <div class="detail-row"><span class="detail-label">健康评分</span><span class="detail-value">${formatNumber(data.health, 2)}</span></div>
    </div>
    <div class="detail-card">
      <h4>📊 派生指标</h4>
      <div class="detail-row"><span class="detail-label">异常度</span><span class="detail-value">${formatNumber(data.anomaly, 2)}</span></div>
      <div class="detail-row"><span class="detail-label">价格</span><span class="detail-value">${data.price !== null && data.price !== undefined ? `${data.currency || priceCurrency || ''} ${formatNumber(data.price, 2)}` : '-'}</span></div>
      <div class="detail-row"><span class="detail-label">数据完整度</span><span class="detail-value">${data.completeness !== null && data.completeness !== undefined ? `${Math.round(data.completeness * 100)}%` : '-'}</span></div>
      <div>
        ${(data.flags || []).map(flag => `<span class="flag-tag flag-${['high_price_low_health', 'high_sugar_high_nova'].includes(flag) ? 'bad' : 'warn'}">${flagNames[flag] || flag}</span>`).join('')}
        ${(!data.flags || data.flags.length === 0) ? '<span class="flag-tag flag-good">正常</span>' : ''}
      </div>
    </div>
  `;
  const titleEl = panel.querySelector('.panel-title');
  titleEl.innerHTML = `⑤ 产品详情 — <b>${data.name || data.id}</b> <button onclick="hideDetail()" style="float:right;background:none;border:1px solid #dcc8b0;border-radius:4px;padding:2px 10px;cursor:pointer;color:#8b5e3c;font-size:12px;">✕ 关闭</button>`;
  document.getElementById('detailContent').innerHTML = html;
  panel.classList.add('show');
}

function hideDetail() {
  document.querySelector('.panel-detail').classList.remove('show');
}

function populateSelectors() {
  const countrySelect = document.getElementById('countrySelect');
  const categorySelect = document.getElementById('categorySelect');
  countrySelect.innerHTML = '<option value="">全部国家</option>';
  categorySelect.innerHTML = '<option value="">全部品类</option>';

  COUNTRIES.forEach(country => {
    const option = document.createElement('option');
    option.value = country.enName;
    option.textContent = `${country.name} (${(country.samples / 1000).toFixed(0)}k)`;
    countrySelect.appendChild(option);
  });

  CATEGORIES.forEach(category => {
    const option = document.createElement('option');
    option.value = category.enName;
    option.textContent = `${category.name} (${(category.samples / 1000).toFixed(0)}k)`;
    categorySelect.appendChild(option);
  });
}

async function loadBootstrap() {
  const payload = await fetchJson('/api/bootstrap');
  COUNTRIES = payload.countries || [];
  CATEGORIES = payload.categories || [];
  priceCurrency = payload.defaultPriceCurrency || 'EUR';
  updateCategoryColorMap();
  populateSelectors();
}

async function loadProductData() {
  const requestId = ++currentDataRequestId;
  anomalyChart.showLoading('default', { text: '加载中...' });
  priceChart.showLoading('default', { text: '加载中...' });
  try {
    const query = buildQueryString();
    const [anomalyPayload, pricePayload] = await Promise.all([
      fetchJson(`/api/products/anomaly?${query}`),
      fetchJson(`/api/products/price?${query}`),
    ]);
    if (requestId !== currentDataRequestId) return false;
    scatterData = anomalyPayload.products || [];
    priceScatterData = pricePayload.products || [];
    priceCurrency = pricePayload.currency || priceCurrency || 'EUR';
    return true;
  } catch (error) {
    if (requestId === currentDataRequestId) {
      scatterData = [];
      priceScatterData = [];
      console.error(error);
    }
    return false;
  } finally {
    if (requestId === currentDataRequestId) {
      anomalyChart.hideLoading();
      priceChart.hideLoading();
    }
  }
}

async function refreshAll({ loadProducts = true } = {}) {
  if (loadProducts) {
    const fresh = await loadProductData();
    if (!fresh) {
      renderMap(currentMetric);
      renderSunburst();
      renderAnomaly();
      renderPrice();
      return;
    }
  }
  renderMap(currentMetric);
  renderSunburst();
  renderAnomaly();
  renderPrice();
}

function resetMapView() {
  mapZoomedTo = null;
  selectedCountry = '';
  document.getElementById('countrySelect').value = '';
  setBackButtonVisibility();
  refreshAll();
}

document.getElementById('countrySelect').addEventListener('change', event => {
  selectedCountry = event.target.value;
  mapZoomedTo = selectedCountry || null;
  setBackButtonVisibility();
  refreshAll();
});

document.getElementById('categorySelect').addEventListener('change', event => {
  selectedCategory = event.target.value;
  refreshAll();
});

document.getElementById('metricSelect').addEventListener('change', event => {
  currentMetric = event.target.value;
  renderMap(currentMetric);
  renderSunburst();
});

document.getElementById('anomalyX').addEventListener('change', () => renderAnomaly());
document.getElementById('anomalyY').addEventListener('change', () => renderAnomaly());

document.getElementById('resetBtn').addEventListener('click', () => {
  selectedCountry = '';
  selectedCategory = '';
  currentMetric = 'health_score';
  mapZoomedTo = null;
  document.getElementById('countrySelect').value = '';
  document.getElementById('categorySelect').value = '';
  document.getElementById('metricSelect').value = 'health_score';
  setBackButtonVisibility();
  hideDetail();
  refreshAll();
});

window.addEventListener('resize', () => {
  mapChart.resize();
  sunChart.resize();
  anomalyChart.resize();
  priceChart.resize();
});

async function init() {
  try {
    await loadBootstrap();
    try {
      const geoJson = await fetchJson('data/world.json');
      echarts.registerMap('world', geoJson);
      worldMapReady = true;
    } catch (error) {
      worldMapReady = false;
      console.warn('World map data failed to load, falling back to bar chart.', error);
    }
    await refreshAll();
  } catch (error) {
    console.error('FoodAtlas front-end bootstrap failed.', error);
    mapChart.setOption({
      title: { text: '数据加载失败', left: 'center', top: 'middle', textStyle: { color: '#8b5e3c', fontSize: 16 } }
    });
  }
}

init();
</script>
</body>
</html>
